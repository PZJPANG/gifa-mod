<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>转向提醒</title>
  <style>
    :root {
      --gold-1: #ffe27a;
      --gold-2: #ffb21f;
      --ink: #1d1f26;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    body { display: flex; align-items: center; justify-content: center; }

    /* 深色半透明胶囊：圆形徽章 + 文字 */
    #card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 26px 12px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(34, 37, 46, 0.86), rgba(18, 20, 26, 0.86));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0;
      transform: translateY(-14px) scale(0.96);
      transition: opacity 220ms ease, transform 260ms cubic-bezier(0.2, 0.9, 0.3, 1.2);
    }
    #card.show { opacity: 1; transform: none; }
    #card.show.out { opacity: 0; transform: translateY(-8px) scale(0.98); transition: opacity 420ms ease, transform 420ms ease; }

    /* 金色渐变圆徽章，里面是深色的导航式转弯箭头 */
    #badge {
      position: relative;
      width: 76px;
      height: 76px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, var(--gold-1), var(--gold-2) 72%);
      box-shadow: 0 4px 14px rgba(255, 178, 31, 0.35), inset 0 -3px 6px rgba(150, 90, 0, 0.25), inset 0 2px 3px rgba(255, 255, 255, 0.55);
    }
    #badge svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .stroke { fill: none; stroke: var(--ink); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .head { fill: var(--ink); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }

    #label { display: flex; flex-direction: column; line-height: 1.1; }
    #text { font-size: 30px; font-weight: 800; color: #fff; letter-spacing: 3px; }
    #deg { margin-top: 4px; font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.62); letter-spacing: 0.5px; }

    /* 箭头朝转弯方向轻推两下，像在指路 */
    #card.show.left #icon { animation: nudge-left 700ms ease-in-out 2; }
    #card.show.right #icon { animation: nudge-right 700ms ease-in-out 2; }
    #card.show.back #icon { animation: nudge-down 700ms ease-in-out 2; }
    @keyframes nudge-left { 50% { transform: translateX(-4px); } }
    @keyframes nudge-right { 50% { transform: translateX(4px); } }
    @keyframes nudge-down { 50% { transform: translateY(3px); } }

    /* 调整位置模式：整块可拖，虚线框 + 锁定按钮 */
    body.editing { -webkit-app-region: drag; cursor: move; }
    body.editing::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 2px dashed rgba(245, 196, 81, 0.9);
      border-radius: 14px;
      pointer-events: none;
    }
    #bar {
      display: none;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      gap: 8px;
      align-items: center;
      padding: 3px 6px 3px 10px;
      border-radius: 6px;
      background: rgba(20, 20, 24, 0.85);
      color: #ddd;
      font-size: 12px;
      white-space: nowrap;
      z-index: 2;
    }
    body.editing #bar { display: flex; }
    #bar button {
      -webkit-app-region: no-drag;
      cursor: pointer;
      border: 0;
      border-radius: 4px;
      padding: 3px 10px;
      font: inherit;
      font-weight: 600;
      color: #1b1b1b;
      background: #f5c451;
    }
  </style>
</head>
<body>
  <div id="card">
    <div id="badge">
      <svg viewBox="-50 -50 100 100"><g id="icon"></g></svg>
    </div>
    <div id="label"><span id="text">右转</span><span id="deg"></span></div>
  </div>
  <div id="bar"><span>拖动到合适位置</span><button id="btnLock">锁定</button></div>
  <script src="./turn.js"></script>
</body>
</html>
